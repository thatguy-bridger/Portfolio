<!-- @dsCard group="Portfolio Builder" viewport="1280x760" name="Portfolio Builder app" subtitle="Public page → builder → templates → settings, click-through" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>html,body{margin:0;height:100%}#root{height:100vh;overflow:hidden}</style></head>
<body><div id="root"></div>
<script type="text/babel" data-presets="react">
</script>
<script type="text/babel" src="PublicPortfolio.jsx"></script>
<script type="text/babel" src="BuilderDashboard.jsx"></script>
<script type="text/babel" src="TemplateGallery.jsx"></script>
<script type="text/babel" src="SettingsScreen.jsx"></script>
<script type="text/babel">
function App(){
const [view,setView]=React.useState('public');
const [showGallery,setShowGallery]=React.useState(false);
const [showSettings,setShowSettings]=React.useState(false);
const NavBtn=({id,label})=>(
<button onClick={()=>setView(id)} style={{
padding:'8px 16px',borderRadius:'var(--radius-pill)',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,
background:view===id?'var(--indigo-500)':'var(--surface-card)',color:view===id?'#fff':'var(--text-body)'
}}>{label}</button>);
return (<div style={{height:'100%',display:'flex',flexDirection:'column',fontFamily:'Inter,sans-serif'}}>
<div style={{display:'flex',gap:8,padding:'12px 16px',borderBottom:'1px solid var(--border-default)',background:'var(--bg)'}}>
<NavBtn id="public" label="Public page"/><NavBtn id="dashboard" label="Builder dashboard"/>
</div>
<div style={{flex:1,overflowY:'auto',position:'relative'}}>
{view==='public'&&<PublicPortfolio/>}
{view==='dashboard'&&<BuilderDashboard onOpenGallery={()=>setShowGallery(true)} onOpenSettings={()=>setShowSettings(true)}/>}
{showGallery&&<TemplateGallery onClose={()=>setShowGallery(false)}/>}
{showSettings&&<SettingsScreen onClose={()=>setShowSettings(false)}/>}
</div>
</div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
